name: NGX Daily Data

# Every weekday at 20:15 WAT (19:15 UTC), after Kobo Terminal publishes the
# day's market wrap (stamped "As of 20:00 WAT"). Collects free data for every
# ticker in watchlist.txt into data/, then runs Claude research only for
# tickers that filed new results. The Streamlit dashboard reads data/.
on:
  schedule:
    - cron: "15 19 * * 1-5"
  workflow_dispatch:
    inputs:
      research_tickers:
        description: "Research these tickers now (comma-separated, e.g. GTCO,ZENITHBANK). Leave blank for normal run."
        required: false
        default: ""
      skip_research:
        description: "Collect data only, no Claude calls"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ngx-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect free data
        run: python ngx_data.py

      - name: Claude research (new results only)
        if: ${{ !inputs.skip_research }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          MAX_SEARCHES: ${{ vars.MAX_SEARCHES }}
          MAX_RESEARCH_PER_RUN: ${{ vars.MAX_RESEARCH_PER_RUN }}
          RESEARCH_BACKFILL_PER_RUN: ${{ vars.RESEARCH_BACKFILL_PER_RUN }}
          RESEARCH_TICKERS: ${{ inputs.research_tickers }}
        run: python ngx_research.py

      - name: Commit data
        run: |
          git config user.name "ngx-bot"
          git config user.email "ngx-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "NGX data $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          else
            echo "No data changes."
          fi
