name: Live test (temporary)
on:
  push:
    branches: [claude/ngx-dashboard-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Run live test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash test/live_test.sh
      - name: Commit output to probe-data branch
        if: always()
        run: |
          set -e
          trap 'echo "::error::save step failed: $BASH_COMMAND"' ERR
          git config user.name "ngx-bot"; git config user.email "ngx-bot@users.noreply.github.com"
          rm -rf /tmp/o && mkdir -p /tmp/o && cp -r data test_out /tmp/o/
          git reset -q --hard
          git clean -qfd
          git checkout -q --orphan probe-out-tmp
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/o/* .
          git add -A
          git commit -qm "live test $(date -u +%FT%TZ)"
          git push -f origin probe-out-tmp:refs/heads/claude/probe-data
