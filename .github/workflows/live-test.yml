name: Live test (temporary)
on:
  push:
    branches: [claude/ngx-dashboard-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Run live test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash test/live_test.sh
      - name: Commit output to probe-data branch
        if: always()
        run: |
          git config user.name "ngx-bot"; git config user.email "ngx-bot@users.noreply.github.com"
          mkdir -p /tmp/o && cp -r data test_out /tmp/o/ 2>/dev/null || true
          git checkout --orphan claude/probe-data
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/o/* .
          git add -A; git commit -qm "live test $(date -u +%FT%TZ)"
          git push -f origin claude/probe-data
