name: NGX Weekly Research

# Runs every Saturday at 08:00 WAT (07:00 UTC) on the tickers in watchlist.txt.
# You can also trigger it manually from the Actions tab.
on:
  schedule:
    - cron: "0 7 * * 6"
  workflow_dispatch:

permissions:
  contents: write   # allows the workflow to commit the research file back to the repo

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          MAX_SEARCHES: ${{ vars.MAX_SEARCHES }}
        run: python ngx_research.py

      - name: Commit research
        run: |
          git config user.name "ngx-bot"
          git config user.email "ngx-bot@users.noreply.github.com"
          git add output/ || true
          if ! git diff --cached --quiet; then
            git commit -m "NGX research $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          else
            echo "No new research to commit."
          fi
